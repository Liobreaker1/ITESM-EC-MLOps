version: '3'

services:
  query:
    build:
      context: .
      target: devel
    command: sh -c "poetry run uvicorn src.main:app --reload --host=0.0.0.0 --port=8000"
    ports:
      - 8000:8000
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks
      - ./src:/app/src

  predict:
    build:
      context: .
      target: testing
    command: sh -c "poetry run uvicorn src.main:app --reload --host=0.0.0.0 --port=8001"
    ports:
      - 8001:8001
